name: Daily product reel

# 01:00 UTC = 08:00 Asia/Ho_Chi_Minh (UTC+7). Doi gio o day neu can.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Product id cu the (de trong = lay san pham moi nhat)'
        required: false
        default: ''

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cai ffmpeg + thu vien Chrome headless (bo qua neu da co san)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          if command -v ffmpeg >/dev/null && dpkg -s libnss3 >/dev/null 2>&1; then
            echo "ffmpeg + libnss3 da co san tren runner, bo qua apt-get."
            ffmpeg -version | head -1
            exit 0
          fi
          for i in 1 2 3; do
            timeout 90 sudo apt-get update && break || echo "apt-get update lan $i loi/timeout, thu lai..."
          done
          timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg \
            libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libasound2t64 \
            libpangocairo-1.0-0 libpango-1.0-0 fonts-liberation libappindicator3-1
          ffmpeg -version | head -1

      - name: Cai dependencies (npm ci + Chrome cho Puppeteer)
        run: npm ci

      - name: Render video + dang Facebook Reels
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then
            node runner.js --id "${{ github.event.inputs.id }}"
          else
            node runner.js
          fi
